<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" content="width=600">
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
</head>
<body>
    <div id="popup-content">    

        <div id="settings-div">
            <form id="settings-form">
                <div class="form-input">
                    <input type="checkbox" id="home-stories-check" name="home-stories-check">
                    <label for="home-stories-check">home page stories</label>
                </div>
                <div class="form-input">
                    <input type="checkbox" id="home-feed-check" name="home-feed-check">
                    <label for="home-feed-check">home page feed</label>
                </div>
                <div class="form-input">
                    <input type="checkbox" id="gray-scale-check" name="gray-scale-check">
                    <label for="gray-scale-check">apply gray scale</label>
                </div>
                <div class="form-input">
                    <input type="checkbox" name="void-mode-check" id="void-mode-check">
                    <label for="void-mode-check">void mode</label>
                </div>
                <div class="form-input">
                    <input type="checkbox" name="hide-comments-check" id="hide-comments-check">
                    <label for="hide-comments-check">hide comments</label>
                </div>
                <div class="form-input form-save" >
                    <input type="submit" value="Apply settings">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
